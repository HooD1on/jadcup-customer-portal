<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="shadowBowl" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="7" flood-color="#166534" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="16" fill="#dcfce7"/>
  <!-- Base shadow -->
  <ellipse cx="200" cy="320" rx="110" ry="20" fill="#15803d" opacity="0.12"/>
  <!-- Bowl body -->
  <path d="M70 210 Q75 320 200 320 Q325 320 330 210 Z" fill="#22c55e" filter="url(#shadowBowl)"/>
  <!-- Bowl body highlight -->
  <path d="M85 215 Q90 310 200 310 Q250 310 280 295 L285 215 Z" fill="#16a34a" opacity="0.2"/>
  <!-- Left shine -->
  <path d="M90 220 Q95 295 140 310 L140 220 Z" fill="#86efac" opacity="0.3"/>
  <!-- Bowl rim -->
  <ellipse cx="200" cy="210" rx="130" ry="35" fill="#86efac"/>
  <ellipse cx="200" cy="208" rx="125" ry="32" fill="#22c55e"/>
  <!-- Inner bowl visible -->
  <ellipse cx="200" cy="208" rx="110" ry="28" fill="#16a34a" opacity="0.4"/>
  <!-- Rim highlight -->
  <path d="M80 205 Q140 180 200 178 Q260 180 320 205" fill="none" stroke="#e8f5e9" stroke-width="2.5" opacity="0.5"/>
  <!-- Domed lid -->
  <ellipse cx="200" cy="208" rx="120" ry="30" fill="#bbf7d0" opacity="0.85"/>
  <!-- Dome curve -->
  <path d="M85 205 Q200 120 315 205" fill="#dcfce7" opacity="0.7"/>
  <path d="M85 205 Q200 120 315 205" fill="none" stroke="#86efac" stroke-width="1.5"/>
  <!-- Dome highlight -->
  <path d="M130 190 Q200 140 270 190" fill="none" stroke="#e8f5e9" stroke-width="2" opacity="0.6"/>
  <!-- Dome top knob -->
  <ellipse cx="200" cy="155" rx="12" ry="5" fill="#86efac"/>
  <ellipse cx="200" cy="153" rx="10" ry="4" fill="#dcfce7"/>
</svg>
