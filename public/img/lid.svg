<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="shadowLid" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="8" flood-color="#166534" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="16" fill="#bbf7d0"/>
  <!-- Shadow underneath -->
  <ellipse cx="205" cy="265" rx="130" ry="50" fill="#15803d" opacity="0.1"/>
  <!-- Outer rim - 3/4 view oval -->
  <ellipse cx="200" cy="210" rx="140" ry="65" fill="#86efac" filter="url(#shadowLid)"/>
  <!-- Top surface -->
  <ellipse cx="200" cy="200" rx="135" ry="60" fill="#dcfce7"/>
  <!-- Inner ring -->
  <ellipse cx="200" cy="200" rx="110" ry="48" fill="none" stroke="#86efac" stroke-width="2"/>
  <!-- Raised dome center -->
  <ellipse cx="200" cy="198" rx="90" ry="38" fill="#e8f5e9"/>
  <!-- Inner dome ring -->
  <ellipse cx="200" cy="196" rx="65" ry="26" fill="none" stroke="#bbf7d0" stroke-width="1.5"/>
  <!-- Sip opening slot -->
  <path d="M160 185 Q165 178 195 178 L195 182 Q170 183 165 188 Z" fill="#16a34a" opacity="0.6"/>
  <ellipse cx="178" cy="183" rx="20" ry="5" fill="#15803d" opacity="0.5"/>
  <!-- Highlight arc on rim -->
  <path d="M80 205 Q120 160 200 150 Q280 160 320 205" fill="none" stroke="#e8f5e9" stroke-width="3" opacity="0.6"/>
  <!-- Rim thickness side -->
  <path d="M60 210 Q60 225 200 240 Q340 225 340 210" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.4"/>
  <!-- Small cross marks on dome -->
  <line x1="200" y1="188" x2="200" y2="208" stroke="#bbf7d0" stroke-width="1"/>
  <line x1="185" y1="198" x2="215" y2="198" stroke="#bbf7d0" stroke-width="1"/>
</svg>
