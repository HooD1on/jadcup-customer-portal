<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="shadowBox" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#166534" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="16" fill="#e8f5e9"/>
  <!-- Ground shadow -->
  <path d="M100 340 L210 360 L330 330 L220 310 Z" fill="#15803d" opacity="0.1"/>
  <!-- Right side face -->
  <polygon points="270,120 340,155 340,310 270,330" fill="#15803d" filter="url(#shadowBox)"/>
  <!-- Front face -->
  <polygon points="90,155 270,120 270,330 90,310" fill="#22c55e"/>
  <!-- Front face highlight -->
  <polygon points="95,160 180,145 180,320 95,305" fill="#16a34a" opacity="0.15"/>
  <!-- Top face -->
  <polygon points="90,155 270,120 340,155 160,190" fill="#86efac"/>
  <!-- Top flap lines -->
  <line x1="180" y1="137" x2="180" y2="190" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>
  <line x1="90" y1="155" x2="160" y2="190" stroke="#16a34a" stroke-width="1" opacity="0.4"/>
  <line x1="270" y1="120" x2="340" y2="155" stroke="#16a34a" stroke-width="1" opacity="0.4"/>
  <!-- Top flap fold hint -->
  <path d="M125 172 Q180 158 305 138" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <!-- Front edge lines (corrugation hint) -->
  <line x1="90" y1="200" x2="270" y2="175" stroke="#16a34a" stroke-width="0.8" opacity="0.2"/>
  <line x1="90" y1="240" x2="270" y2="215" stroke="#16a34a" stroke-width="0.8" opacity="0.2"/>
  <line x1="90" y1="280" x2="270" y2="255" stroke="#16a34a" stroke-width="0.8" opacity="0.2"/>
  <!-- Right face edge lines -->
  <line x1="270" y1="200" x2="340" y2="215" stroke="#166534" stroke-width="0.8" opacity="0.2"/>
  <line x1="270" y1="240" x2="340" y2="250" stroke="#166534" stroke-width="0.8" opacity="0.2"/>
  <line x1="270" y1="280" x2="340" y2="285" stroke="#166534" stroke-width="0.8" opacity="0.2"/>
  <!-- Edges -->
  <polygon points="90,155 270,120 340,155 160,190" fill="none" stroke="#166534" stroke-width="1.5" opacity="0.3"/>
  <line x1="90" y1="155" x2="90" y2="310" stroke="#166534" stroke-width="1.5" opacity="0.3"/>
  <line x1="270" y1="120" x2="270" y2="330" stroke="#166534" stroke-width="1.5" opacity="0.3"/>
  <line x1="340" y1="155" x2="340" y2="310" stroke="#166534" stroke-width="1.5" opacity="0.3"/>
</svg>
