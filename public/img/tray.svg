<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="shadowTray" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#166534" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="16" fill="#e8f5e9"/>
  <!-- Ground shadow -->
  <path d="M60 310 L180 340 L350 300 L230 270 Z" fill="#15803d" opacity="0.1"/>
  <!-- Tray bottom face -->
  <polygon points="80,230 280,195 340,240 140,275" fill="#16a34a" filter="url(#shadowTray)"/>
  <!-- Tray front wall -->
  <polygon points="80,230 140,275 140,300 80,260" fill="#15803d"/>
  <!-- Tray right wall -->
  <polygon points="140,275 340,240 340,265 140,300" fill="#166534"/>
  <!-- Tray inner bottom -->
  <polygon points="85,232 278,198 335,240 142,273" fill="#22c55e"/>
  <!-- Inner bottom shine -->
  <polygon points="90,235 180,218 230,238 140,255" fill="#86efac" opacity="0.2"/>
  <!-- Tray back wall top edge -->
  <polygon points="80,200 280,165 340,210 140,245" fill="none" stroke="#16a34a" stroke-width="1"/>
  <!-- Back left wall -->
  <polygon points="80,200 80,230 140,275 140,245" fill="#22c55e" opacity="0.6"/>
  <!-- Back right wall -->
  <polygon points="280,165 280,195 340,240 340,210" fill="#16a34a" opacity="0.6"/>
  <!-- Top left wall -->
  <polygon points="80,200 280,165 280,195 80,230" fill="#86efac"/>
  <!-- Rim highlight -->
  <line x1="80" y1="200" x2="280" y2="165" stroke="#dcfce7" stroke-width="2" opacity="0.6"/>
  <line x1="80" y1="200" x2="140" y2="245" stroke="#dcfce7" stroke-width="1.5" opacity="0.4"/>
  <!-- Inner texture lines -->
  <line x1="120" y1="240" x2="300" y2="210" stroke="#16a34a" stroke-width="0.7" opacity="0.2"/>
  <line x1="130" y1="255" x2="315" y2="225" stroke="#16a34a" stroke-width="0.7" opacity="0.2"/>
  <!-- Edge outlines -->
  <polygon points="80,200 280,165 340,210 140,245" fill="none" stroke="#166534" stroke-width="1" opacity="0.3"/>
</svg>
